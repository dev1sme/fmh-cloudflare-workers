"$schema" = "./node_modules/wrangler/config-schema.json"
name = "nha-tro"
main = "./src/server/index.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# Custom domain. Wrangler creates the DNS record in the dev1sme.cloud zone on
# deploy. Declaring `routes` disables the *.workers.dev URL — that is
# deliberate; set `workers_dev = true` if a fallback URL is ever wanted.
#
# Renamed from fmh.dev1sme.cloud: FMH is a building, not the product. The old
# hostname is gone rather than kept alongside, so anyone still on a saved link
# gets a hard failure instead of a quietly stale bookmark.
routes = [{ pattern = "rentals.dev1sme.cloud", custom_domain = true }]

# Deploy fails loudly if these are not set on the Worker (`wrangler secret put`).
#
# This list also decides which secrets from `.dev.vars` get wired into the
# local Worker — a name missing here is simply absent from `c.env` in dev, with
# no warning. Add every new secret.
[secrets]
required = ["JWT_SECRET", "SEPAY_WEBHOOK_SECRET"]

[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "nha-tro"
database_id = "5adee76f-9107-43c1-b428-4ba9b49bc1e5"
migrations_dir = "./migrations"

[observability]
enabled = true
